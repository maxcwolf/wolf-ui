name: release

# Changesets: on main, open or update the "version packages" PR; when that PR is merged, publish
# @maxcwolf/ui-tokens and @maxcwolf/ui-react-native. Needs the NPM_TOKEN secret: changesets
# publishes with `yarn npm publish`, which reads YARN_NPM_AUTH_TOKEN, not NODE_AUTH_TOKEN.
on:
  push:
    branches: [main]

concurrency: release

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - run: corepack enable
      - run: yarn install --immutable
      - uses: changesets/action@v1
        with:
          publish: yarn release
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          YARN_NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
